<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 48" role="img" aria-labelledby="title description">
  <title id="title">OPEMOS gradient pill</title>
  <desc id="description">A rounded Steam blue to NVIDIA green gradient mark.</desc>
  <defs>
    <linearGradient id="opemos-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a9fff"/>
      <stop offset="0.48" stop-color="#0875b5"/>
      <stop offset="1" stop-color="#76b900"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="190" height="46" rx="23" fill="url(#opemos-gradient)"/>
  <rect x="2.5" y="2.5" width="187" height="43" rx="21.5" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="1.5"/>
</svg>
