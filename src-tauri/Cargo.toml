[package]
name="steamos-nvidia-image-builder"
version="0.1.0"
description="Build NVIDIA-oriented SteamOS images from official Valve recovery images"
authors= ["CorniiDog"]
edition="2021"

[lib]
name="steamos_nvidia_image_builder_lib"
crate-type= ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build= {version="2",features= [] }

[dependencies]
base64 = "0.22.1"
bzip2 = "0.6.1"
flate2 = "1.1.10"
libc = "0.2"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "native-tls", "system-proxy"] }
serde= {version="1",features= ["derive"] }
serde_json={version="1",features=["raw_value"]}
sha2="0.10"
tar = "0.4.44"
tauri= {version="2",features= ["macos-private-api"] }
tauri-plugin-dialog="2"
tauri-plugin-opener="2"
xz2 = "0.1.7"

[target.'cfg(windows)'.dependencies]
russh = { version = "0.63.2", default-features = false, features = ["ring"] }
tokio = { version = "1.53.0", features = ["rt", "time"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.dev.package.sha2]
opt-level=3
