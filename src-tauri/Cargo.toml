[package]
name="steamos-nvidia-image-builder"
version="0.1.0"
description="Build NVIDIA-oriented SteamOS images from official Valve recovery images"
authors= ["CorniiDog"]
edition="2021"

[lib]
name="steamos_nvidia_image_builder_lib"
crate-type= ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build= {version="2",features= [] }

[dependencies]
serde= {version="1",features= ["derive"] }
tauri= {version="2",features= [] }
tauri-plugin-dialog="2"
tauri-plugin-opener="2"
