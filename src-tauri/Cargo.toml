[package]
name="steamos-nvidia-image-builder"
version="0.1.0"
description="Build NVIDIA-oriented SteamOS images from official Valve recovery images"
authors= ["CorniiDog"]
edition="2021"

[lib]
name="steamos_nvidia_image_builder_lib"
crate-type= ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build= {version="2",features= [] }

[dependencies]
bzip2 = "0.6.1"
flate2 = "1.1.10"
libc = "0.2"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "native-tls", "system-proxy"] }
serde= {version="1",features= ["derive"] }
serde_json="1"
sha2="0.10"
tar = "0.4.44"
tauri= {version="2",features= ["macos-private-api"] }
tauri-plugin-dialog="2"
tauri-plugin-opener="2"
xz2 = "0.1.7"

[profile.dev.package.sha2]
opt-level=3
