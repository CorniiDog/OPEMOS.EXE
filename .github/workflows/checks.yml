name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-and-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run frontend, documentation, and hygiene checks
        run: npm run test:frontend

      - name: Check committed patch whitespace
        run: git diff --check

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out immutable OPEMOS Core contract fixtures
        uses: actions/checkout@v4
        with:
          repository: CorniiDog/open-gpu-kernel-modules-steamos-support
          ref: 1fde359025031a99055763dca76e0d709486ffac
          path: opemos-core-contracts
          persist-credentials: false

      - name: Install Tauri Linux dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          build-essential curl file libayatana-appindicator3-dev
          librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev patchelf pkg-config

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Reject Rust warnings
        run: >-
          cargo clippy --manifest-path src-tauri/Cargo.toml
          --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          OPEMOS_CORE_CONTRACT_ROOT: ${{ github.workspace }}/opemos-core-contracts
          OPEMOS_CORE_EXPECTED_COMMIT: 1fde359025031a99055763dca76e0d709486ffac
