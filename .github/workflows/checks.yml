  ubuntu-quality:
    if: always() && needs.source-route.outputs.platform == 'ubuntu'
    needs: source-route
    runs-on: ${{ fromJSON(needs.source-route.outputs.runner || '["ubuntu-24.04"]') }}
    timeout-minutes: 65
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Fail visibly when the actual OMEN route is unavailable
        if: needs.source-route.outputs.ready != 'true'
        run: |
          python3 - <<'PY'
          import pathlib,json,xml.etree.ElementTree as E
          p=pathlib.Path('source-results');p.mkdir(exist_ok=True)
          reason='Actual admitted OMEN source route unavailable; no guest test or compiler ran'
          (p/'source-failure.json').write_text(json.dumps({'status':'failed','reason':reason,'actualGuestExecuted':False,'compilerPassed':False}))
          suite=E.Element('testsuite',name='Unavailable actual source workload',tests='1',failures='1',skipped='0')
          E.SubElement(E.SubElement(suite,'testcase',name='Actual OMEN source workload'),'failure').text=reason
          E.ElementTree(suite).write(p/'xunit.xml',encoding='utf-8',xml_declaration=True)
          (p/'report.html').write_text('<html><body><h1>FAILED / unavailable</h1><p>'+reason+'</p></body></html>')
          print('::error::'+reason)
          raise SystemExit(1)
          PY
      # Root job-start guard must verify this entire workflow blob against its
      # adopted template before any step; no candidate checkout is permitted.
