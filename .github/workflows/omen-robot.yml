name: 04 SteamOS
run-name: ${{ inputs.required_platform && format('04 SteamOS required {0} {1}/{2} {3}', inputs.required_platform, inputs.producer_run, inputs.producer_attempt, inputs.correlation_nonce) || '04 SteamOS all required VMs and executables' }}

on:
  workflow_dispatch:
    inputs:
      required_platform:
        description: Exact authenticated producer gate; empty runs full inventory
        type: choice
        options: ['', ubuntu, windows, macos]
        default: ''
      producer_run:
        type: string
        default: ''
      producer_attempt:
        type: string
        default: ''
      artifact_id:
        type: string
        default: ''
      source_sha:
        type: string
        default: ''
      candidate_pr:
        description: Optional real same-repository PR; controller is independently qualified
        type: string
        default: ''
      candidate_sha:
        type: string
        default: ''
      candidate_ref:
        description: Exact refs/heads branch; mutually exclusive with candidate_pr
        type: string
        default: ''
      candidate_base:
        type: string
        default: ''
      correlation_nonce:
        type: string
        default: ''
  workflow_run:
    workflows: [01 Windows EXE, 02 Ubuntu AppImage, 03 macOS Executable]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: opemos-omen-robot
  cancel-in-progress: false

jobs:
  trusted-runner-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      ready: ${{ steps.guard.outputs.ready }}
      source: ${{ steps.guard.outputs.source }}
      implementation: ${{ steps.guard.outputs.implementation }}
      producer: ${{ steps.scope.outputs.producer }}
      platform: ${{ steps.scope.outputs.platform || steps.guard.outputs.platform || inputs.required_platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the complete Robot producer is present
        run: |
          python3 - <<'PYREADY'
          import json
          import os
          from pathlib import Path
          required = ['scripts/omen_robot_gate.py', 'scripts/robot_client.py',
                      'scripts/OPEMOSRobot.py', 'scripts/OPEMOSGuest.py',
                      'scripts/OPEMOSPointer.py', 'scripts/run_omen_robot_guest.py',
                      'scripts/omen_robot.py', 'scripts/omen_ci.py',
                      'scripts/omen_ci_executables.py', 'scripts/omen_ci_inventory.py',
                      'scripts/omen_ci_reader.py', 'scripts/omen_ci_result.py',
                      'scripts/omen_ci_stage.py', 'tests/robot/inventory.robot',
                      'scripts/omen_output_lifecycle.py', 'scripts/omen_output_media.py',
                      'scripts/omen_robot_plan.py', 'scripts/omen_steamos_guest.py',
                      'scripts/omen_steamos_native.py', 'scripts/omen_steamos_probe.py',
                      'tests/robot/output-install.robot',
                      'tests/robot/role.robot', 'tests/robot/guest.robot',
                      'ci/gui-pointer-contract.json', 'ci/robot-installed-hook-contract.json',
                      'scripts/required_omen.py', 'tests/robot/required-platform.robot']
          missing = [name for name in required if not Path(name).is_file()]
          out = Path('robot-preflight')
          out.mkdir(exist_ok=True)
          readiness = {'source_commit': os.environ['GITHUB_SHA'],
                       'producer_ready': not missing, 'missing_files': missing,
                       'full_stack_passed': False}
          (out / 'producer-readiness.json').write_text(json.dumps(readiness, indent=2) + '\n')
          if missing:
              rows = json.loads(Path('ci/required-vms.json').read_text())['required_vms']
              reason = 'Complete Robot producer is not integrated on this source'
              value = {'status': 'failed', 'source_commit': os.environ['GITHUB_SHA'],
                       'vms': {row['id']: {'name': row['name'], 'status': 'unavailable',
                                           'reason': reason} for row in rows},
                       'executable_acceptance': {name: {'status': 'unavailable', 'reason': reason}
                                                for name in ('windows', 'ubuntu', 'macos')}}
              (out / 'all20.json').write_text(json.dumps(value, indent=2) + '\n')
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
                  report.write('| Required VM | Result |\n|---|---|\n')
                  for row in rows:
                      report.write('| ' + row['name'] + ' | unavailable: producer not integrated |\n')
                  report.write('\nNo VM, pointer, USB, SteamOS or NVIDIA pass has been established.\n')
              raise SystemExit(reason + ': ' + ', '.join(missing))
          PYREADY
      - id: guard
        name: Verify trusted event, current protected Main and fresh dedicated runner heartbeat
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPEMOS_OMEN_ROBOT_RUNNER_STATE: ${{ vars.OPEMOS_OMEN_ROBOT_RUNNER_STATE }}
        run: python3 scripts/omen_robot_gate.py
      - id: scope
        name: Bind exact artifact from passed native package JOB before OMEN
        if: steps.guard.outputs.ready == 'true' && (inputs.required_platform != '' || steps.guard.outputs.candidate == 'true')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPEMOS_OMEN_ROBOT_RUNNER_STATE: ${{ vars.OPEMOS_OMEN_ROBOT_RUNNER_STATE }}
        run: python3 scripts/required_omen.py scope-guard
      - name: Always provide unavailable reports when trusted route or scope failed
        if: always() && (steps.guard.outputs.ready != 'true' || steps.scope.outcome == 'failure')
        run: python3 scripts/required_omen.py diagnostics --directory robot-preflight --reason 'Trusted current route/producer artifact unavailable; no OMEN pass'
      - name: Always retain explicit all20 preflight outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: robot-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: robot-preflight/
          if-no-files-found: error
          retention-days: ${{ github.repository == 'CorniiDog/OPEMOS.EXE' && github.ref == 'refs/heads/main' && 90 || 1 }}

  actual-robot-transactions:
    needs: trusted-runner-route
    if: needs.trusted-runner-route.outputs.ready == 'true' && needs.trusted-runner-route.outputs.platform == ''
    runs-on: [self-hosted, Linux, X64, opemos-omen-robot]
    timeout-minutes: 240
    env:
      OPEMOS_SOURCE_SHA: ${{ needs.trusted-runner-route.outputs.source }}
      OPEMOS_ROBOT_REPORT_DIR: ${{ github.workspace }}/robot-results
      OPEMOS_ROBOT_CONTROL_SOCKET: /run/opemos-ci/control/control.sock
      OPEMOS_ROBOT_REPORT_EXCHANGE: /home/connor/.local/share/opemos-ci/github-runner/robot-private/reports
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # Existing Root job hook must verify the whole reviewed implementation,
      # current Main checkpoint and protected qualification BEFORE checkout.
      # A candidate source/ref or repository variable alone grants no scope.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.trusted-runner-route.outputs.implementation }}
          persist-credentials: false
      - name: Bind existing ephemeral job token to the accepted fixed host guard
        shell: bash
        run: |
          set -euo pipefail
          set +x
          /usr/bin/timeout --signal=TERM --kill-after=5s 45s /usr/bin/python3 -I -B /var/lib/opemos-robot-control-r1/guard/job_guard.py --bind-job-token
      - name: Execute fresh admitted Robot queue cases and actual pointer drivers
        shell: bash
        run: |
          set -euo pipefail
          : "${OPEMOS_ROBOT_PYTHON:?Fixed job guard must expose the official pinned RF7.5 runtime}"
          : "${OPEMOS_ROBOT_PRIVATE_RESULTS:?Fixed job guard must reserve private current-run metadata}"
          export OPEMOS_CONSUMER_STARTED_EPOCH="$(date +%s)"
          "$OPEMOS_ROBOT_PYTHON" -c "import importlib.metadata; assert importlib.metadata.version('robotframework') == '7.5'"
          "$OPEMOS_ROBOT_PYTHON" -m robot --outputdir robot-results --output output.xml --report report.html --log log.html --xunit xunit.xml tests/robot/inventory.robot
      - name: Always retain explicit unavailable reports if Robot did not start
        if: always()
        run: |
          if [ ! -f robot-results/output.xml ]; then
            python3 scripts/required_omen.py diagnostics --reason 'Actual all-VM Robot did not start; SteamOS and every unavailable role fail'
          fi
      - name: Always return Robot reports, actual screenshots, argv, logs and guest NVIDIA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: robot-actual-${{ github.run_id }}-${{ github.run_attempt }}
          path: robot-results/
          if-no-files-found: error
          retention-days: ${{ github.repository == 'CorniiDog/OPEMOS.EXE' && github.ref == 'refs/heads/main' && 90 || 1 }}

  required-platform-robot:
    needs: trusted-runner-route
    if: needs.trusted-runner-route.result == 'success' && needs.trusted-runner-route.outputs.platform != ''
    runs-on: [self-hosted, Linux, X64, opemos-omen-robot]
    timeout-minutes: 240
    env:
      OPEMOS_SOURCE_SHA: ${{ needs.trusted-runner-route.outputs.source }}
      OPEMOS_REQUIRED_PRODUCER: ${{ needs.trusted-runner-route.outputs.producer }}
      OPEMOS_ROBOT_REPORT_DIR: ${{ github.workspace }}/robot-results
      OPEMOS_ROBOT_CONTROL_SOCKET: /run/opemos-ci/control/control.sock
      OPEMOS_ROBOT_REPORT_EXCHANGE: /home/connor/.local/share/opemos-ci/github-runner/robot-private/reports
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # SAME existing Root job-start guard: exact04/current protected Main,
      # no PR workflow/caller argv/host credential or queue bypass.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.trusted-runner-route.outputs.implementation }}
          persist-credentials: false
      - name: Bind existing ephemeral job token to the accepted fixed host guard
        shell: bash
        run: |
          set -euo pipefail
          set +x
          /usr/bin/timeout --signal=TERM --kill-after=5s 45s /usr/bin/python3 -I -B /var/lib/opemos-robot-control-r1/guard/job_guard.py --bind-job-token
      - name: Execute exact producer through actual Root Robot Build and SteamOS
        run: |
          set -euo pipefail
          : "${OPEMOS_ROBOT_PYTHON:?Root current-Main job guard must expose pinned RF7.5}"
          : "${OPEMOS_ROBOT_PRIVATE_RESULTS:?Root current-run reservation required}"
          export OPEMOS_CONSUMER_STARTED_EPOCH="$(date +%s)"
          "$OPEMOS_ROBOT_PYTHON" -c "import importlib.metadata; assert importlib.metadata.version('robotframework') == '7.5'"
          "$OPEMOS_ROBOT_PYTHON" -m robot --outputdir robot-results --output output.xml --report report.html --log log.html --xunit xunit.xml tests/robot/required-platform.robot
      - name: Always retain real reports or explicit unavailable diagnostic bundle
        if: always()
        run: |
          if [ ! -f robot-results/output.xml ]; then
            python3 scripts/required_omen.py diagnostics --reason 'Root/RF/actual operation unavailable; no actual GUI acceptance'
          fi
      - name: Always upload actual Robot XML HTML xUnit frames argv logs and NVIDIA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: robot-actual-${{ github.run_id }}-${{ github.run_attempt }}
          path: robot-results/
          if-no-files-found: error
          retention-days: ${{ github.repository == 'CorniiDog/OPEMOS.EXE' && github.ref == 'refs/heads/main' && 90 || 1 }}

  required-platform-result:
    needs: [trusted-runner-route, required-platform-robot]
    if: always() && needs.trusted-runner-route.outputs.platform != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Retrieve closed exact-run preflight context
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: robot-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: robot-preflight
      - name: Retrieve exact actual result and public diagnostic artifact
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: robot-actual-${{ github.run_id }}-${{ github.run_attempt }}
          path: robot-results
      - name: Strict current producer broker Robot image USB SteamOS final result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPEMOS_OMEN_ROBOT_RUNNER_STATE: ${{ vars.OPEMOS_OMEN_ROBOT_RUNNER_STATE }}
        run: python3 scripts/required_omen.py finalize-scope
      - name: Always upload exact required outcome, including failed missing roles
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omen-required-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: required-result/required-result.json
          if-no-files-found: error
          retention-days: ${{ github.repository == 'CorniiDog/OPEMOS.EXE' && github.ref == 'refs/heads/main' && 90 || 1 }}
      - name: Always upload hosted failure reports even when self-hosted is unavailable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: required-hosted-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: robot-results/
          if-no-files-found: error
          retention-days: ${{ github.repository == 'CorniiDog/OPEMOS.EXE' && github.ref == 'refs/heads/main' && 90 || 1 }}
