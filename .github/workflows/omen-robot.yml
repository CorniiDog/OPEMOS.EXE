name: 04 SteamOS
run-name: ${{ inputs.required_platform && format('04 SteamOS required {0} {1}/{2} {3}', inputs.required_platform, inputs.producer_run, inputs.producer_attempt, inputs.correlation_nonce) || '04 SteamOS all required VMs and executables' }}

on:
  workflow_dispatch:
    inputs:
      required_platform:
        description: Candidate producer selected automatically by native push job; empty runs full inventory
        type: choice
        options: ['', ubuntu, windows]
        default: ''
      producer_run:
        type: string
        default: ''
      producer_attempt:
        type: string
        default: ''
      artifact_id:
        type: string
        default: ''
      source_sha:
        type: string
        default: ''
      correlation_nonce:
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  trusted-runner-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      ready: ${{ steps.guard.outputs.ready }}
      source: ${{ steps.guard.outputs.source }}
      producer: ${{ steps.scope.outputs.producer }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: guard
        name: Verify protected controller workflow and fresh installed-controller heartbeat
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPEMOS_OMEN_ROBOT_RUNNER_STATE: ${{ vars.OPEMOS_OMEN_ROBOT_RUNNER_STATE }}
        run: python3 scripts/omen_robot_gate.py
      - name: Load the exact installed reviewed controller reader
        if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.guard.outputs.source }}
          persist-credentials: false
      - id: scope
        name: Bind exact artifact from passed native package JOB before OMEN
        if: steps.guard.outputs.ready == 'true' && inputs.required_platform != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPEMOS_SOURCE_SHA: ${{ steps.guard.outputs.source }}
        run: python3 scripts/required_omen.py scope-guard
      - name: Always provide unavailable reports when trusted route or scope failed
        if: always() && (steps.guard.outputs.ready != 'true' || steps.scope.outcome == 'failure')
        run: python3 scripts/required_omen.py diagnostics --directory robot-preflight --reason 'Trusted current route/producer artifact unavailable; no OMEN pass'
      - name: Retain optional preflight diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: robot-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: robot-preflight/
          if-no-files-found: warn
          retention-days: ${{ github.repository == 'CorniiDog/OPEMOS.EXE' && github.ref == 'refs/heads/main' && 90 || 1 }}

  actual-robot-transactions:
    needs: trusted-runner-route
    if: needs.trusted-runner-route.outputs.ready == 'true' && inputs.required_platform == ''
    runs-on: [self-hosted, Linux, X64, opemos-omen-robot]
    timeout-minutes: 240
    env:
      OPEMOS_SOURCE_SHA: ${{ needs.trusted-runner-route.outputs.source }}
      OPEMOS_ROBOT_REPORT_DIR: ${{ github.workspace }}/robot-results
      OPEMOS_ROBOT_CONTROL_SOCKET: /run/opemos-ci/control/control.sock
      OPEMOS_ROBOT_REPORT_EXCHANGE: /home/connor/.local/share/opemos-ci/github-runner/robot-private/reports
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # Root-installed ACTIONS_RUNNER_HOOK_JOB_STARTED independently verifies
      # this reviewed workflow plus installed controller identity BEFORE checkout;
      # candidate code is never checked out on the OMEN controller.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.trusted-runner-route.outputs.source }}
          persist-credentials: false
      - name: Bind existing ephemeral job token to the accepted fixed host guard
        shell: bash
        run: |
          set -euo pipefail
          set +x
          /usr/bin/timeout --signal=TERM --kill-after=5s 45s /usr/bin/python3 -I -B /var/lib/opemos-robot-control-r1/guard/job_guard.py --bind-job-token
      - name: Execute fresh admitted Robot queue cases and actual pointer drivers
        shell: bash
        run: |
          set -euo pipefail
          : "${OPEMOS_ROBOT_PYTHON:?Fixed job guard must expose the official pinned RF7.5 runtime}"
          : "${OPEMOS_ROBOT_PRIVATE_RESULTS:?Fixed job guard must reserve private current-run metadata}"
          export OPEMOS_CONSUMER_STARTED_EPOCH="$(date +%s)"
          "$OPEMOS_ROBOT_PYTHON" -c "import importlib.metadata; assert importlib.metadata.version('robotframework') == '7.5'"
          "$OPEMOS_ROBOT_PYTHON" -m robot --outputdir robot-results --output output.xml --report report.html --log log.html --xunit xunit.xml tests/robot/inventory.robot
      - name: Always retain explicit unavailable reports if Robot did not start
        if: always()
        run: |
          if [ ! -f robot-results/output.xml ]; then
            python3 scripts/required_omen.py diagnostics --reason 'Actual all-VM Robot did not start; SteamOS and every unavailable role fail'
          fi
      - name: Always return Robot reports, actual screenshots, argv, logs and guest NVIDIA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: robot-actual-${{ github.run_id }}-${{ github.run_attempt }}
          path: robot-results/
          if-no-files-found: error
          retention-days: ${{ github.repository == 'CorniiDog/OPEMOS.EXE' && github.ref == 'refs/heads/main' && 90 || 1 }}

  required-platform-robot:
    needs: trusted-runner-route
    if: needs.trusted-runner-route.result == 'success' && inputs.required_platform != ''
    runs-on: [self-hosted, Linux, X64, opemos-omen-robot]
    timeout-minutes: 240
    env:
      OPEMOS_SOURCE_SHA: ${{ needs.trusted-runner-route.outputs.source }}
      OPEMOS_REQUIRED_PRODUCER: ${{ needs.trusted-runner-route.outputs.producer }}
      OPEMOS_ROBOT_REPORT_DIR: ${{ github.workspace }}/robot-results
      OPEMOS_ROBOT_CONTROL_SOCKET: /run/opemos-ci/control/control.sock
      OPEMOS_ROBOT_REPORT_EXCHANGE: /home/connor/.local/share/opemos-ci/github-runner/robot-private/reports
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # SAME Root job-start guard: protected04 workflow and installed controller;
      # candidate package is authenticated data for the disposable guest only.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.trusted-runner-route.outputs.source }}
          persist-credentials: false
      - name: Bind existing ephemeral job token to the accepted fixed host guard
        shell: bash
        run: |
          set -euo pipefail
          set +x
          /usr/bin/timeout --signal=TERM --kill-after=5s 45s /usr/bin/python3 -I -B /var/lib/opemos-robot-control-r1/guard/job_guard.py --bind-job-token
      - name: Execute exact producer through actual Root Robot Build and SteamOS
        run: |
          set -euo pipefail
          : "${OPEMOS_ROBOT_PYTHON:?Root installed-controller job guard must expose pinned RF7.5}"
          : "${OPEMOS_ROBOT_PRIVATE_RESULTS:?Root current-run reservation required}"
          export OPEMOS_CONSUMER_STARTED_EPOCH="$(date +%s)"
          "$OPEMOS_ROBOT_PYTHON" -c "import importlib.metadata; assert importlib.metadata.version('robotframework') == '7.5'"
          "$OPEMOS_ROBOT_PYTHON" -m robot --outputdir robot-results --output output.xml --report report.html --log log.html --xunit xunit.xml tests/robot/required-platform.robot
      - name: Always retain real reports or explicit unavailable diagnostic bundle
        if: always()
        run: |
          if [ ! -f robot-results/output.xml ]; then
            python3 scripts/required_omen.py diagnostics --reason 'Root/RF/actual operation unavailable; no actual GUI acceptance'
          fi
      - name: Always upload actual Robot XML HTML xUnit frames argv logs and NVIDIA
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: robot-actual-${{ github.run_id }}-${{ github.run_attempt }}
          path: robot-results/
          if-no-files-found: error
          retention-days: ${{ github.repository == 'CorniiDog/OPEMOS.EXE' && github.ref == 'refs/heads/main' && 90 || 1 }}

  required-platform-result:
    needs: [trusted-runner-route, required-platform-robot]
    if: always() && inputs.required_platform != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      OPEMOS_SOURCE_SHA: ${{ needs.trusted-runner-route.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.trusted-runner-route.outputs.source || github.sha }}
          persist-credentials: false
      - name: Retrieve closed exact-run preflight context
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: robot-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: robot-preflight
      - name: Retrieve exact actual result and public diagnostic artifact
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: robot-actual-${{ github.run_id }}-${{ github.run_attempt }}
          path: robot-results
      - name: Strict current producer broker Robot image USB SteamOS final result
        run: python3 scripts/required_omen.py finalize-scope
      - name: Always upload exact required outcome, including failed missing roles
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: omen-required-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: required-result/required-result.json
          if-no-files-found: error
          retention-days: ${{ github.repository == 'CorniiDog/OPEMOS.EXE' && github.ref == 'refs/heads/main' && 90 || 1 }}
      - name: Always upload hosted failure reports even when self-hosted is unavailable
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: required-hosted-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: robot-results/
          if-no-files-found: error
          retention-days: ${{ github.repository == 'CorniiDog/OPEMOS.EXE' && github.ref == 'refs/heads/main' && 90 || 1 }}
