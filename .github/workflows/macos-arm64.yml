name: Apple Silicon app

on:
  pull_request:
  workflow_dispatch:
    # This check always proves the admitted fullstack graph. No advertised
    # chooser-only control may silently select a different execution mode.

permissions:
  contents: read

concurrency:
  group: macos-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-app:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      OPEMOS_EXE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      OPEMOS_CORE_EXPECTED_COMMIT: 01407aa6174b80e92cb7f3dcb534ade5cdd7bf00
      OPEMOS_CORE_CONTRACT_ROOT: ${{ github.workspace }}/opemos-core-contracts
      OPEMOS_MACOS_FULLSTACK: '1'
      CARGO_BUILD_JOBS: 1
      RUST_TEST_THREADS: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.OPEMOS_EXE_COMMIT }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CorniiDog/open-gpu-kernel-modules-steamos-support
          ref: 01407aa6174b80e92cb7f3dcb534ade5cdd7bf00
          path: opemos-core-contracts
          fetch-depth: 186
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          targets: aarch64-apple-darwin
          components: clippy, rustfmt
      - name: Native build and actual graphical transaction
        run: python3 scripts/check_macos_arm64_ci.py
      - name: Preserve exact app, failures and GUI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-arm64-${{ env.OPEMOS_EXE_COMMIT }}-${{ github.run_attempt }}
          path: build/macos-arm64-evidence
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
