name: 02 Ubuntu AppImage
# OMEN_GUEST_SOURCE_WORKLOAD_V1: hosted jobs orchestrate; compilation stays in OMEN.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ubuntu-executable-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      ready: ${{ steps.route.outputs.ready }}
      runner: ${{ steps.route.outputs.runner }}
    steps:
      - id: route
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPEMOS_OMEN_ROBOT_RUNNER_STATE: ${{ vars.OPEMOS_OMEN_ROBOT_RUNNER_STATE }}
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request,pathlib
          ready=False;reason='Actual current OMEN route unavailable'
          try:
              assert os.environ['GITHUB_REPOSITORY']=='CorniiDog/OPEMOS.EXE'
              headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json'}
              url='https://api.github.com/repos/CorniiDog/OPEMOS.EXE/branches/main'
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self,*args):return None
              with urllib.request.build_opener(NoRedirect).open(urllib.request.Request(url,headers=headers),timeout=20)as r:
                  raw=r.read(1048577);assert len(raw)<=1048576;main=json.loads(raw)
              state=json.loads(os.environ['OPEMOS_OMEN_ROBOT_RUNNER_STATE'])
              assert main['protected']is True and state['repository']=='CorniiDog/OPEMOS.EXE'and state['source_commit']==main['commit']['sha']
              assert state['version']==1 and type(state['checked_at'])is int and state['expires_at']==state['checked_at']+180
              assert state['checked_at']<=time.time()<state['expires_at']and state['ready']is True
              assert state['labels']==['self-hosted','Linux','X64','opemos-omen-robot']and state['runner_name']=='opemos-omen-robot'
              assert type(state['runner_id'])is int and state['runner_id']>0
              ready=True;reason='Online route only; no guest/source/compiler/GUI result'
          except Exception as e:reason+=': '+type(e).__name__
          pathlib.Path('source-route').mkdir()
          pathlib.Path('source-route/route.json').write_text(json.dumps({'ready':ready,'reason':reason,'actualGuestExecuted':False,'compilerPassed':False}))
          with open(os.environ['GITHUB_OUTPUT'],'a')as f:
              f.write('ready='+str(ready).lower()+'\nrunner='+json.dumps(['self-hosted','Linux','X64','opemos-omen-robot']if ready else['ubuntu-24.04'])+'\n')
          if not ready:print('::error::'+reason)
          PY
      - name: Retain exact route-only diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-route-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-route/
          if-no-files-found: error
          retention-days: ${{ github.repository == 'CorniiDog/OPEMOS.EXE' && github.ref == 'refs/heads/main' && 90 || 1 }}

  appimage-package:
    if: always()
    needs: source-route
    runs-on: ${{ fromJSON(needs.source-route.outputs.runner || '["ubuntu-24.04"]') }}
    timeout-minutes: 65
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Fail visibly when the actual OMEN route is unavailable
        if: needs.source-route.outputs.ready != 'true'
        run: |
          python3 - <<'PY'
          import pathlib,json,xml.etree.ElementTree as E
          p=pathlib.Path('source-results');p.mkdir(exist_ok=True)
          reason='Actual admitted OMEN source route unavailable; no guest test or compiler ran'
          (p/'source-failure.json').write_text(json.dumps({'status':'failed','reason':reason,'actualGuestExecuted':False,'compilerPassed':False}))
          suite=E.Element('testsuite',name='Unavailable actual source workload',tests='1',failures='1',skipped='0')
          E.SubElement(E.SubElement(suite,'testcase',name='Actual OMEN source workload'),'failure').text=reason
          E.ElementTree(suite).write(p/'xunit.xml',encoding='utf-8',xml_declaration=True)
          (p/'report.html').write_text('<html><body><h1>FAILED / unavailable</h1><p>'+reason+'</p></body></html>')
          print('::error::'+reason)
          raise SystemExit(1)
          PY
      # Root job-start guard must verify this entire workflow blob against its
      # adopted template before any step; no candidate checkout is permitted.
      - name: Bind existing ephemeral token to the fixed source-only scope
        if: needs.source-route.outputs.ready == 'true'
        run: /usr/bin/timeout --signal=TERM --kill-after=5s 45s /usr/bin/python3 -I -B /var/lib/opemos-robot-control-r1/guard/job_guard.py --bind-job-token
      - name: Wait for actual admitted OMEN guest appimage-package
        if: needs.source-route.outputs.ready == 'true'
        run: /usr/bin/python3 -E -s -B /var/lib/opemos-robot-control-r1/source/scripts/omen_source_ci.py run-required --workload appimage-package --directory source-results
      - name: Upload guest-produced immutable package
        id: executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OPEMOS-Ubuntu-AppImage-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: linux-package-artifact
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: ${{ github.repository == 'CorniiDog/OPEMOS.EXE' && github.ref == 'refs/heads/main' && 90 || 1 }}
      - name: Bind exact executable and package to this producer artifact
        env:
          PRODUCER_ARTIFACT_ID: ${{ steps.executable.outputs.artifact-id }}
          PRODUCER_ARTIFACT_SHA256: ${{ steps.executable.outputs.artifact-digest }}
        run: >-
          /usr/bin/python3 -E -s -B /var/lib/opemos-robot-control-r1/source/scripts/omen_source_ci.py record
          --platform ubuntu
          --artifact-id "$PRODUCER_ARTIFACT_ID"
          --artifact-sha "$PRODUCER_ARTIFACT_SHA256"
          --artifact-name "OPEMOS-Ubuntu-AppImage-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}"
          --output build/executable-producer
      - name: Retain small producer identity for separate SteamOS acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: executable-producer-ubuntu-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/executable-producer/executable-producer.json
          if-no-files-found: error
          retention-days: ${{ github.repository == 'CorniiDog/OPEMOS.EXE' && github.ref == 'refs/heads/main' && 90 || 1 }}
      - name: Make missing actual source proof explicit
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,json,xml.etree.ElementTree as E
          p=pathlib.Path('source-results');p.mkdir(exist_ok=True)
          if not (p/'source-proof.json').exists():
              if not (p/'source-failure.json').exists():
                  (p/'source-failure.json').write_text(json.dumps({'status':'failed','reason':'Fixed A guard/client or actual guest result unavailable; inspect retained job logs','compilerPassed':False}))
              if not (p/'xunit.xml').exists():
                  s=E.Element('testsuite',name='Missing actual OMEN source proof',tests='1',failures='1',skipped='0')
                  E.SubElement(E.SubElement(s,'testcase',name='Actual source workload'),'failure').text='No accepted actual guest/compiler result'
                  E.ElementTree(s).write(p/'xunit.xml',encoding='utf-8',xml_declaration=True)
              (p/'report.html').write_text('<html><body><h1>FAILED / no actual source proof</h1></body></html>')
          PY
      - name: Always retain actual source results or precise failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-appimage-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-results/
          if-no-files-found: error
          retention-days: ${{ github.repository == 'CorniiDog/OPEMOS.EXE' && github.ref == 'refs/heads/main' && 90 || 1 }}

  omen-required:
    name: Required OMEN GUI image + SteamOS (ubuntu)
    needs: appimage-package
    if: always() && github.repository == 'CorniiDog/OPEMOS.EXE' && github.ref == 'refs/heads/main' && github.ref_protected && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 250
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out trusted Main gate only; never PR code on OMEN
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require current actual OMEN GUI Build, image, USB and SteamOS
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/required_omen.py dispatch-and-wait --platform ubuntu
      - name: Always retain required gate reports and unavailable diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: required-omen-ubuntu-${{ github.run_id }}-${{ github.run_attempt }}
          path: required-omen-results/
          if-no-files-found: error
          retention-days: ${{ github.repository == 'CorniiDog/OPEMOS.EXE' && github.ref == 'refs/heads/main' && 90 || 1 }}

  omen-required-untrusted:
    name: Required OMEN unavailable on non-Main source (ubuntu)
    needs: appimage-package
    if: always() && !(github.repository == 'CorniiDog/OPEMOS.EXE' && github.ref == 'refs/heads/main' && github.ref_protected && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      OPEMOS_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Record unsupported source as failed without dispatch credentials
        run: |
          python3 scripts/required_omen.py diagnostics --directory required-omen-results --reason 'Non-Main/PR/fork source is not admitted to OMEN; no dispatch, GUI, image, USB or SteamOS acceptance'
          exit 1
      - name: Always retain unavailable required outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: required-omen-ubuntu-${{ github.run_id }}-${{ github.run_attempt }}
          path: required-omen-results/
          if-no-files-found: error
          retention-days: ${{ github.repository == 'CorniiDog/OPEMOS.EXE' && github.ref == 'refs/heads/main' && 90 || 1 }}
