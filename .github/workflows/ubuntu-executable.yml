name: 02 Ubuntu AppImage

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ubuntu-executable-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  source-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact executable source as guest input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out immutable Core contracts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CorniiDog/OPEMOS
          ref: 01407aa6174b80e92cb7f3dcb534ade5cdd7bf00
          path: opemos-core-contracts
          fetch-depth: 186
          persist-credentials: false
      - name: Refresh signed Ubuntu package metadata for download-only inputs
        run: sudo apt-get update
      - name: Set up download toolchain
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - name: Set up locked Rust download toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Download immutable appliance without building project code
        run: python3 scripts/acquire_appliance_windows.py --output build/appliance/linux
      - name: Prepare source and locked download inputs; compilation is guest-only
        run: >-
          python3 scripts/prepare_ubuntu_source_inputs.py
          --source "${{ github.event.pull_request.head.sha || github.sha }}"
          --core opemos-core-contracts
          --appliance build/appliance/linux/fedora-builder.qcow2
          --output build/ubuntu-source-inputs
      - name: Retain authenticated Ubuntu guest source inputs
        id: inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Ubuntu-source-inputs-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: |
            build/ubuntu-source-inputs/ubuntu-source-inputs.tar
            build/ubuntu-source-inputs/source-input.json
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Bind actual source-input archive identity
        env:
          INPUT_ID: ${{ steps.inputs.outputs.artifact-id }}
          INPUT_SHA: ${{ steps.inputs.outputs.artifact-digest }}
          INPUT_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('build/ubuntu-source-inputs')
          definition = json.loads((root/'source-input.json').read_bytes())
          value = dict(kind='UBUNTU_SOURCE_INPUT_ARTIFACT_V1', repository='CorniiDog/OPEMOS.EXE',
              source_commit=os.environ['INPUT_SOURCE'], producer_run_id=os.environ['GITHUB_RUN_ID'],
              producer_attempt=os.environ['GITHUB_RUN_ATTEMPT'], artifact_id=os.environ['INPUT_ID'],
              artifact_name='Ubuntu-source-inputs-'+os.environ['INPUT_SOURCE']+'-'+os.environ['GITHUB_RUN_ATTEMPT'],
              artifact_archive_sha256=os.environ['INPUT_SHA'], input=definition)
          out = Path('build/source-input-metadata'); out.mkdir()
          (out/'source-input-artifact.json').write_text(json.dumps(value,sort_keys=True)+'\n')
          PY
      - name: Retain small source-input identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-input-ubuntu-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/source-input-metadata/source-input-artifact.json
          if-no-files-found: error
          retention-days: 1

  appimage-package:
    needs: source-inputs
    if: github.repository == 'CorniiDog/OPEMOS.EXE' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, X64, opemos-omen-robot]
    timeout-minutes: 150
    steps:
      # No candidate checkout, shell, npm, cargo or AppImage runs on OMEN host.
      # The Root hook authenticates this exact reviewed workflow/helper body.
      - name: Bind ephemeral Actions token to the source-build role
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          /usr/bin/timeout --signal=TERM --kill-after=5s 45s /usr/bin/python3 -I -B
          /var/lib/opemos-robot-control-r1/guard/job_guard.py --bind-job-token
      - name: Compile and package in admitted OMEN Ubuntu guest
        run: /usr/bin/python3 /run/opemos-ci/engine/scripts/required_omen.py build-source-on-omen
      - name: Retain Ubuntu executable packages
        id: executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OPEMOS-Ubuntu-AppImage-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.OPEMOS_GUEST_PRODUCED_PACKAGE_DIRECTORY }}
          if-no-files-found: error
          compression-level: 0
      - name: Bind exact executable and package to this producer artifact
        env:
          PRODUCER_ARTIFACT_ID: ${{ steps.executable.outputs.artifact-id }}
          PRODUCER_ARTIFACT_SHA256: ${{ steps.executable.outputs.artifact-digest }}
        run: /usr/bin/python3 /run/opemos-ci/engine/scripts/required_omen.py record-guest-package
      - name: Retain small producer identity for separate SteamOS acceptance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: executable-producer-ubuntu-${{ github.run_id }}-${{ github.run_attempt }}
          path: executable-producer.json
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 1 }}
      - name: Retain actual guest compiler and closure reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ubuntu-guest-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-build-results/
          if-no-files-found: error
          retention-days: 1

  omen-required:
    name: Required OMEN GUI image + SteamOS (ubuntu)
    needs: appimage-package
    if: github.repository == 'CorniiDog/OPEMOS.EXE' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 250
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out orchestration source; never execute candidate on OMEN host
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require current actual OMEN GUI Build, image, USB and SteamOS
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPEMOS_CANDIDATE_SHA: ${{ github.sha }}
        run: python3 scripts/required_omen.py dispatch-and-wait --platform ubuntu
      - name: Always retain required gate reports and unavailable diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: required-omen-ubuntu-${{ github.run_id }}-${{ github.run_attempt }}
          path: required-omen-results/
          if-no-files-found: error
          retention-days: ${{ github.ref == 'refs/heads/main' && 90 || 1 }}
