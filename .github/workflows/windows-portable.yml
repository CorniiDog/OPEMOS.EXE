name: Windows portable artifact

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPEMOS_EXE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  OPEMOS_CORE_COMMIT: b02ff79265e20bd7ef4fa4e16835c3c343afdee2
  RUST_TOOLCHAIN: 1.98.1
  NODE_VERSION: 22.23.2

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out EXE source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.OPEMOS_EXE_COMMIT }}
          persist-credentials: false

      - name: Verify immutable EXE identity
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -cne $env:OPEMOS_EXE_COMMIT) {
            throw "EXE checkout mismatch: $actual"
          }

      - name: Preserve canonical Core bytes
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Check out immutable OPEMOS Core contracts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: CorniiDog/OPEMOS
          ref: b02ff79265e20bd7ef4fa4e16835c3c343afdee2
          path: opemos-core-contracts
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable OPEMOS Core identity
        shell: pwsh
        run: |
          $actual = git -C opemos-core-contracts rev-parse HEAD
          if ($actual -cne $env:OPEMOS_CORE_COMMIT) {
            throw "Core checkout mismatch: $actual"
          }

      - name: Set up exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: npm

      - name: Set up exact Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1

      - name: Install locked JavaScript dependencies
        run: npm ci

      - name: Validate this workflow policy
        run: node scripts/windows-portable-workflow.mjs

      - name: Run Windows workflow policy tests
        run: node --test tests/windows-portable-workflow.test.mjs

      - name: Verify bundled maintainer workflow against exact Core output
        run: node scripts/check_core_maintainer_workflow.mjs
        env:
          OPEMOS_CORE_CONTRACT_ROOT: ${{ github.workspace }}/opemos-core-contracts

      - name: Compile locked Rust tests and run Windows cases
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked windows_
        env:
          OPEMOS_CORE_CONTRACT_ROOT: ${{ github.workspace }}/opemos-core-contracts
          OPEMOS_CORE_EXPECTED_COMMIT: b02ff79265e20bd7ef4fa4e16835c3c343afdee2

      - name: Build unsigned portable executable
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --locked

      - name: Smoke-test portable executable startup
        shell: pwsh
        run: |
          $source = "src-tauri/target/release/steamos-nvidia-image-builder.exe"
          $process = Start-Process -FilePath $source -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 250
              $process.Refresh()
              if ($process.HasExited) {
                throw "Portable executable exited during startup with code $($process.ExitCode)."
              }
            } while (($process.MainWindowHandle -eq 0 -or $process.MainWindowTitle -cne "SteamOS NVIDIA Builder") -and [DateTime]::UtcNow -lt $deadline)
            if ($process.MainWindowHandle -eq 0) {
              throw "Portable executable did not show a native main window within 30 seconds."
            }
            if ($process.MainWindowTitle -cne "SteamOS NVIDIA Builder") {
              throw "Portable executable showed an unexpected window title: $($process.MainWindowTitle)"
            }
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id
              $process.WaitForExit()
            }
          }

      - name: Verify executable and record provenance
        shell: pwsh
        run: |
          $source = "src-tauri/target/release/steamos-nvidia-image-builder.exe"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Expected executable is absent: $source"
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $source
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
            throw "Executable must be unsigned; signature status is $($signature.Status)"
          }
          $output = "windows-portable-artifact"
          New-Item -ItemType Directory -Path $output | Out-Null
          $name = "OPEMOS.EXE-windows-x86_64-unsigned.exe"
          $destination = Join-Path $output $name
          Copy-Item -LiteralPath $source -Destination $destination
          $file = Get-Item -LiteralPath $destination
          $sha256 = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          $lines = @(
            "schema_version=1"
            "repository=$env:GITHUB_REPOSITORY"
            "source_commit=$env:OPEMOS_EXE_COMMIT"
            "core_commit=$env:OPEMOS_CORE_COMMIT"
            "rust_toolchain=$env:RUST_TOOLCHAIN"
            "node_version=$env:NODE_VERSION"
            "runner_image=$env:ImageOS"
            "runner_image_version=$env:ImageVersion"
            "filename=$name"
            "size=$($file.Length)"
            "sha256=$sha256"
            "signed=false"
            "portable=true"
          )
          Set-Content -LiteralPath (Join-Path $output "provenance.txt") -Value $lines -Encoding ascii
          Set-Content -LiteralPath (Join-Path $output "SHA256SUMS.txt") -Value "$sha256  $name" -Encoding ascii

      - name: Upload short-lived workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: OPEMOS.EXE-windows-x86_64-unsigned-${{ env.OPEMOS_EXE_COMMIT }}
          path: windows-portable-artifact
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
