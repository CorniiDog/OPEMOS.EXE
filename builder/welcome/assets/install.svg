<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-labelledby="title desc">
  <title id="title">OPEMOS installation</title>
  <desc id="desc">A recovery image flows safely into a selected computer.</desc>
  <defs>
    <linearGradient id="edge" x1="0" x2="1"><stop stop-color="#57c4fb"/><stop offset="1" stop-color="#78da70"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#254b61" stop-opacity=".88"/><stop offset="1" stop-color="#102b34" stop-opacity=".72"/></linearGradient>
  </defs>
  <rect id="display-frame" x="70" y="48" width="380" height="240" rx="28" fill="url(#glass)" stroke="url(#edge)" stroke-width="4"/>
  <rect id="display-panel" x="94" y="72" width="332" height="180" rx="16" fill="#071923" stroke="#74b8d4" stroke-opacity=".38" stroke-width="4"/>
  <path id="display-stand" d="M224 288h72l10 30h-92z" fill="#183b4b" stroke="#6eb8d4" stroke-opacity=".45" stroke-width="4" stroke-linejoin="round"/>
  <path id="display-base" d="M184 320h152" fill="none" stroke="url(#edge)" stroke-width="8" stroke-linecap="round"/>
  <circle id="download-disc" cx="260" cy="162" r="60" fill="#112d3a" stroke="url(#edge)" stroke-width="8"/>
  <path id="download-arrow" d="M260 119v72m-28-28 28 28 28-28" fill="none" stroke="#eefaff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
